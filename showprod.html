<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>
    body {
      font-family: Arial;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      padding: 10px;
      width: 100%;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 10px;
    }

    .delete {
      background: red;
      margin-top: 10px;
    }

    /* Image Preview Grid */
    #imagePreviewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      min-height: 0;
    }

    .preview-item {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .preview-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #ddd;
    }

    .preview-item .remove-img {
      position: absolute;
      top: -6px;
      right: -6px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      padding: 0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    /* Card Thumbnail Carousel */
    .card-images {
      position: relative;
      width: 100%;
      height: 150px;
      overflow: hidden;
    }

    .card-images img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: none;
    }

    .card-images img.active {
      display: block;
    }

    .card-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .card-nav button {
      width: 48%;
      padding: 4px;
      font-size: 12px;
      background: #555;
    }

    .img-counter {
      font-size: 11px;
      text-align: center;
      color: #888;
      margin-top: 2px;
    }

    label[for="imageFile"] {
      display: block;
      padding: 12px;
      background: #f0f0f0;
      border: 2px dashed #aaa;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      margin: 8px 0;
    }

    label[for="imageFile"]:hover {
      background: #e0e0e0;
    }

    #addBtn {
      background: #1a1a1a;
      margin-top: 12px;
    }

    #addBtn:hover { background: #333; }
  </style>
</head>

<body>

  <h2>Add Product</h2>

  <input id="name" placeholder="Product Name">
  <input id="price" type="number" placeholder="Price">

  <select id="category">
    <option value="">Select Category</option>
    <option value="Indoor">Indoor</option>
    <option value="Outdoor">Outdoor</option>
  </select>

  <select id="subcategory">
    <option value="">Select Subcategory</option>
  </select>

  <label for="imageFile">📷 Click or drag to upload images (multiple allowed)</label>
  <input type="file" id="imageFile" multiple accept="image/*" style="display:none">
  <div id="imagePreviewContainer"></div>

  <input type="file" id="pdfFile" accept="application/pdf">

  <textarea id="description" placeholder="Description"></textarea>

  <button id="addBtn">Add Product</button>

  <h2>Products</h2>

  <select id="filterCategory">
    <option value="">All Categories</option>
  </select>

  <select id="filterSubcategory">
    <option value="">All Subcategories</option>
  </select>

  <div class="grid" id="productList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8JyqoRLjwn93CsL9iOkZ8w79VT2OU5VI",
      authDomain: "cuplighton-72192.firebaseapp.com",
      projectId: "cuplighton-72192",
      storageBucket: "cuplighton-72192.firebasestorage.app",
      messagingSenderId: "60391723671",
      appId: "1:60391723671:web:fc2b7b509b99b595f74fd2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const subcategories = {
      Indoor: ["Recessed", "Pendant"],
      Outdoor: ["Wall", "Garden"]
    };

    const categorySelect = document.getElementById("category");
    const subcategorySelect = document.getElementById("subcategory");
    const imageFileInput = document.getElementById("imageFile");
    const previewContainer = document.getElementById("imagePreviewContainer");

    // Track selected files in a DataTransfer to allow removing individual images
    let selectedFiles = [];

    // --- Subcategory Dropdown ---
    categorySelect.addEventListener("change", () => {
      const selected = categorySelect.value;
      subcategorySelect.innerHTML = "<option value=''>Select Subcategory</option>";
      if (subcategories[selected]) {
        subcategories[selected].forEach(sub => {
          const option = document.createElement("option");
          option.value = sub;
          option.textContent = sub;
          subcategorySelect.appendChild(option);
        });
      }
    });

    // --- Multi-image Preview ---
    imageFileInput.addEventListener("change", () => {
      const newFiles = Array.from(imageFileInput.files);
      newFiles.forEach(file => {
        // Avoid duplicates by name
        if (!selectedFiles.find(f => f.name === file.name)) {
          selectedFiles.push(file);
        }
      });
      imageFileInput.value = ""; // Reset so same file can be re-selected if removed
      renderPreviews();
    });

    function renderPreviews() {
      previewContainer.innerHTML = "";
      selectedFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const item = document.createElement("div");
          item.className = "preview-item";
          item.innerHTML = `
            <img src="${e.target.result}" alt="${file.name}">
            <button class="remove-img" title="Remove" data-index="${index}">&times;</button>
          `;
          item.querySelector(".remove-img").addEventListener("click", () => {
            selectedFiles.splice(index, 1);
            renderPreviews();
          });
          previewContainer.appendChild(item);
        };
        reader.readAsDataURL(file);
      });
    }

    // --- Products State ---
    let allProducts = [];

    async function loadProducts() {
      const snapshot = await getDocs(collection(db, "products"));
      allProducts = [];
      snapshot.forEach(docSnap => {
        allProducts.push({ ...docSnap.data(), id: docSnap.id });
      });
      populateFilters();
      displayProducts(allProducts);
    }

    function populateFilters() {
      const cat = document.getElementById("filterCategory");
      const sub = document.getElementById("filterSubcategory");
      // Avoid duplicating options on reload
      cat.querySelectorAll("option:not([value=''])").forEach(o => o.remove());
      sub.querySelectorAll("option:not([value=''])").forEach(o => o.remove());

      Object.keys(subcategories).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        cat.appendChild(opt);
      });
      Object.values(subcategories).flat().forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        sub.appendChild(opt);
      });
    }

    function displayProducts(products) {
      const list = document.getElementById("productList");
      list.innerHTML = "";

      products.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        // Support both old single-image and new multi-image
        const images = item.images && item.images.length > 0
          ? item.images
          : (item.image ? [item.image] : []);

        const imgsHtml = images.length > 0
          ? images.map((url, i) => `<img src="${url}" class="${i === 0 ? 'active' : ''}">`).join('')
          : '<img src="" alt="No Image" class="active">';

        const navHtml = images.length > 1
          ? `<div class="card-nav">
               <button class="prev-img">◀ Prev</button>
               <button class="next-img">Next ▶</button>
             </div>
             <p class="img-counter">1 / ${images.length}</p>`
          : '';

        card.innerHTML = `
          <div class="card-images">${imgsHtml}</div>
          ${navHtml}
          <h3>${item.name}</h3>
          <p>${item.category} - ${item.subcategory}</p>
          <p>${item.description || ""}</p>
          <strong>${item.price} THB</strong>
          ${item.pdf ? `<br><a href="${item.pdf}" target="_blank">📄 View PDF</a>` : ""}
          <button class="delete">Delete</button>
        `;

        // Carousel Navigation
        if (images.length > 1) {
          let currentIdx = 0;
          const imgEls = card.querySelectorAll(".card-images img");
          const counter = card.querySelector(".img-counter");

          card.querySelector(".prev-img").onclick = () => {
            imgEls[currentIdx].classList.remove("active");
            currentIdx = (currentIdx - 1 + images.length) % images.length;
            imgEls[currentIdx].classList.add("active");
            counter.textContent = `${currentIdx + 1} / ${images.length}`;
          };
          card.querySelector(".next-img").onclick = () => {
            imgEls[currentIdx].classList.remove("active");
            currentIdx = (currentIdx + 1) % images.length;
            imgEls[currentIdx].classList.add("active");
            counter.textContent = `${currentIdx + 1} / ${images.length}`;
          };
        }

        card.querySelector(".delete").onclick = async () => {
          await deleteDoc(doc(db, "products", item.id));
          loadProducts();
        };

        list.appendChild(card);
      });
    }

    document.getElementById("filterCategory").addEventListener("change", filter);
    document.getElementById("filterSubcategory").addEventListener("change", filter);

    function filter() {
      let filtered = allProducts;
      const cat = document.getElementById("filterCategory").value;
      const sub = document.getElementById("filterSubcategory").value;
      if (cat) filtered = filtered.filter(p => p.category === cat);
      if (sub) filtered = filtered.filter(p => p.subcategory === sub);
      displayProducts(filtered);
    }

    // --- Add Product ---
    document.getElementById("addBtn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const price = document.getElementById("price").value;
      const description = document.getElementById("description").value.trim();
      const category = categorySelect.value;
      const subcategory = subcategorySelect.value;
      const pdfFile = document.getElementById("pdfFile").files[0];

      if (!name || !price || !category || !subcategory || selectedFiles.length === 0) {
        alert("Please fill all required fields and select at least one image.");
        return;
      }

      const addBtn = document.getElementById("addBtn");
      addBtn.textContent = "Uploading...";
      addBtn.disabled = true;

      try {
        // Upload all images
        const imageUrls = [];
        for (const file of selectedFiles) {
          const imgRef = ref(storage, "products/" + Date.now() + "_" + file.name);
          await uploadBytes(imgRef, file);
          const url = await getDownloadURL(imgRef);
          imageUrls.push(url);
        }

        // Upload PDF if provided
        let pdfUrl = "";
        if (pdfFile) {
          const pdfRef = ref(storage, "pdfs/" + Date.now() + "_" + pdfFile.name);
          await uploadBytes(pdfRef, pdfFile);
          pdfUrl = await getDownloadURL(pdfRef);
        }

        await addDoc(collection(db, "products"), {
          name,
          price: Number(price),
          description,
          category,
          subcategory,
          images: imageUrls,       // Array of all image URLs
          image: imageUrls[0],     // First image as default (for backward compatibility)
          pdf: pdfUrl
        });

        // Reset form
        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("description").value = "";
        categorySelect.value = "";
        subcategorySelect.innerHTML = "<option value=''>Select Subcategory</option>";
        document.getElementById("pdfFile").value = "";
        selectedFiles = [];
        renderPreviews();

        alert("Product added successfully!");
        loadProducts();
      } catch (err) {
        console.error(err);
        alert("Error adding product: " + err.message);
      } finally {
        addBtn.textContent = "Add Product";
        addBtn.disabled = false;
      }
    });

    loadProducts();
  </script>

</body>

</html>
