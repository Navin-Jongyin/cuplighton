<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');

    :root {
      --bg-dark: #0f0f0f;
      --panel-bg: #1a1a1a;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f0f0;
      --text-muted: #888;
      --accent-gold: #FFC107;
      --accent-gold-hover: #FFB300;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Layout */
    .admin-navbar {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .admin-navbar h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-gold);
    }

    .admin-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 992px) {
      .admin-container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      color: #fff;
    }

    /* Forms */
    .form-group { margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.15);
    }

    select option { background: #222; color: #fff; }
    textarea { resize: vertical; min-height: 100px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
    }

    .btn-primary { background: var(--accent-gold); color: #111; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-gold-hover); transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }

    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 6px; width: auto; }

    /* Upload Area */
    .dashed-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .dashed-upload:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(255, 193, 7, 0.05);
    }

    .dashed-upload svg { margin-bottom: 0.5rem; color: inherit; }

    .file-input-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; display: block; }

    /* Previews */
    .img-preview-box {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .existing-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .preview-item, .existing-img-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-item img, .existing-img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: var(--transition);
    }
    .remove-btn:hover { background: var(--danger); transform: scale(1.1); }

    .remove-img,
    .remove-existing {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: var(--transition);
    }

    .remove-img:hover,
    .remove-existing:hover {
      background: var(--danger);
      transform: scale(1.1);
    }

    /* Product Grid */
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: rgba(255, 193, 7, 0.5);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(-4px);
    }

    .card-images {
      position: relative;
      width: 100%;
      height: 200px;
      background: #111;
    }

    .card-images img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .card-images img.active { display: block; }

    .card-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .card-nav { opacity: 1; }

    .card-nav button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .card-nav button:hover { background: var(--accent-gold); color: #000; }

    .img-counter {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      backdrop-filter: blur(4px);
    }

    .card-content {
      padding: 1.25rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-content h3 { font-size: 1.1rem; margin-bottom: 0.25rem; color: #fff; }
    .card-tags { font-size: 0.8rem; color: var(--accent-gold); margin-bottom: 0.75rem; display: flex; gap: 0.5rem; }
    .card-tags span { background: rgba(255, 193, 7, 0.1); padding: 2px 8px; border-radius: 4px; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; flex-grow: 1; 
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .card-price { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .card-pdf { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; text-decoration: none; transition: 0.2s;}
    .card-pdf:hover { color: var(--accent-gold); }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal-box::-webkit-scrollbar { width: 8px; }
    .modal-box::-webkit-scrollbar-track { background: transparent; }
    .modal-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-close {
      background: rgba(255,255,255,0.05);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>

<body>

  <nav class="admin-navbar">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Admin Dashboard
    </h1>
    <button id="logout-btn" class="btn btn-danger btn-sm">Logout</button>
  </nav>

  <div class="admin-container">
    
    <!-- Left Panel: Add Product -->
    <div class="panel">
      <h2 class="panel-title">Add New Product</h2>
      
      <div class="form-group">
        <label>Product Name</label>
        <input id="name" placeholder="E.g., Nordic Pendant Light">
      </div>
      
      <div class="form-group">
        <label>Price (THB)</label>
        <input id="price" type="number" placeholder="E.g., 2500">
      </div>

      <div class="form-row form-group">
        <div>
          <label>Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Indoor">Indoor</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Decoratives">Decoratives</option>
            <option value="LED/Other">LED / Other</option>
          </select>
        </div>
        <div>
          <label>Subcategory</label>
          <select id="subcategory">
            <option value="">Select Subcategory</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Images</label>
        <label for="imageFile" class="dashed-upload">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Click to upload images (multiple allowed)
        </label>
        <input type="file" id="imageFile" multiple accept="image/*" style="display:none">
        <div id="imagePreviewContainer" class="img-preview-box"></div>
      </div>

      <div class="form-group">
        <label>PDF Specifications</label>
        <input type="file" id="pdfFile" accept="application/pdf">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Product details..."></textarea>
      </div>

      <div class="form-row">
        <button id="clearBtn" class="btn btn-outline">Clear Form</button>
        <button id="addBtn" class="btn btn-primary">Add Product</button>
      </div>
    </div>

    <!-- Right Panel: Product List -->
    <div class="panel">
      <h2 class="panel-title">Manage Products</h2>

      <div class="filter-bar">
        <div style="flex:1">
          <label>Filter Category</label>
          <select id="filterCategory"><option value="">All Categories</option></select>
        </div>
        <div style="flex:1">
          <label>Filter Subcategory</label>
          <select id="filterSubcategory"><option value="">All Subcategories</option></select>
        </div>
      </div>

      <div class="grid" id="productList"></div>
    </div>
  </div>

  <!-- ── Edit Modal ──────────────────────────────── -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="color:#fff; font-size:1.5rem; margin:0;">Edit Product</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>

      <div class="form-group">
        <label>Product Name</label>
        <input id="edit-name" placeholder="Product Name">
      </div>
      
      <div class="form-group">
        <label>Price (THB)</label>
        <input id="edit-price" type="number" placeholder="Price">
      </div>

      <div class="form-row form-group">
        <div>
          <label>Category</label>
          <select id="edit-category">
            <option value="">Select Category</option>
            <option value="Indoor">Indoor</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Decoratives">Decoratives</option>
            <option value="LED/Other">LED / Other</option>
          </select>
        </div>
        <div>
          <label>Subcategory</label>
          <select id="edit-subcategory">
            <option value="">Select Subcategory</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="edit-description" placeholder="Description"></textarea>
      </div>

      <div class="form-group">
        <label style="color:#fff; margin-bottom:0.5rem; display:block;">Current Images</label>
        <div class="existing-images" id="edit-existing-images"></div>
      </div>

      <div class="form-group">
        <label for="edit-imageFile" class="dashed-upload">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add more images
        </label>
        <input type="file" id="edit-imageFile" multiple accept="image/*" style="display:none">
        <div id="edit-image-preview" class="img-preview-box"></div>
      </div>

      <div class="form-group">
        <label>Replace PDF (leave empty to keep current)</label>
        <input type="file" id="edit-pdfFile" accept="application/pdf">
      </div>

      <button id="saveBtn" class="btn btn-primary" style="margin-top:1rem;">Save Changes</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, updateDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8JyqoRLjwn93CsL9iOkZ8w79VT2OU5VI",
      authDomain: "cuplighton-72192.firebaseapp.com",
      projectId: "cuplighton-72192",
      storageBucket: "cuplighton-72192.firebasestorage.app",
      messagingSenderId: "60391723671",
      appId: "1:60391723671:web:fc2b7b509b99b595f74fd2"
    };

    const app     = initializeApp(firebaseConfig);
    const db      = getFirestore(app);
    const storage = getStorage(app);

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeUrl(url) {
      if (!url || typeof url !== "string") return "";
      try {
        const parsed = new URL(url, window.location.origin);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
      } catch (e) {
        return "";
      }
      return "";
    }

    // ── Auth Guard (sessionStorage with simple expiry) ──
    const loginAtMs = Number(sessionStorage.getItem('adminLoginAt') || 0);
    const sessionValid = sessionStorage.getItem('isAdmin') === 'true'
      && Number.isFinite(loginAtMs)
      && (Date.now() - loginAtMs) < (8 * 60 * 60 * 1000);

    if (!sessionValid) {
      sessionStorage.removeItem('isAdmin');
      sessionStorage.removeItem('adminLoginAt');
      window.location.href = 'login.html';
    }

    // ── Logout Button ──
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('isAdmin');
      sessionStorage.removeItem('adminLoginAt');
      window.location.href = 'login.html';
    });

    const subcategories = {
      Indoor:     ["Recessed", "Surface", "Pendant", "Chandelier", "Track Light"],
      Outdoor:    ["Ceiling", "Wall", "Bollard", "In Ground", "Solar", "Pillar",
                   "Post Top", "Street Light", "Flood Light", "Underwater",
                   "Decorative", "L-Column", "High Bay/Low Bay"],
      Decoratives:["Table Lamp", "Floor Lamp"],
      "LED/Other":["Bulb", "LED Strip", "Others"]
    };

    // ── Shared helper: populate a subcategory <select> ──
    function fillSubcategories(selectEl, category, selected = "") {
      selectEl.innerHTML = "<option value=''>Select Subcategory</option>";
      (subcategories[category] || []).forEach(sub => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        if (sub === selected) opt.selected = true;
        selectEl.appendChild(opt);
      });
    }

    // ── Add Form ──
    const categorySelect    = document.getElementById("category");
    const subcategorySelect = document.getElementById("subcategory");
    const imageFileInput    = document.getElementById("imageFile");
    const previewContainer  = document.getElementById("imagePreviewContainer");
    let selectedFiles = [];

    categorySelect.addEventListener("change", () =>
      fillSubcategories(subcategorySelect, categorySelect.value));

    imageFileInput.addEventListener("change", () => {
      Array.from(imageFileInput.files).forEach(f => {
        if (!selectedFiles.find(x => x.name === f.name)) selectedFiles.push(f);
      });
      imageFileInput.value = "";
      renderPreviews(previewContainer, selectedFiles,
        idx => { selectedFiles.splice(idx, 1); renderPreviews(previewContainer, selectedFiles, arguments.callee); }
      );
    });

    function renderPreviews(container, files, onRemove) {
      container.innerHTML = "";
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = e => {
          const item = document.createElement("div");
          item.className = "preview-item";
          item.innerHTML = `<img src="${e.target.result}" alt="${file.name}">
            <button class="remove-img">&times;</button>`;
          item.querySelector(".remove-img").addEventListener("click", () => {
            files.splice(index, 1);
            renderPreviews(container, files, onRemove);
          });
          container.appendChild(item);
        };
        reader.readAsDataURL(file);
      });
    }

    // ── Products State ──
    let allProducts = [];

    async function loadProducts() {
      const snapshot = await getDocs(collection(db, "products"));
      allProducts = [];
      snapshot.forEach(docSnap => allProducts.push({ ...docSnap.data(), id: docSnap.id }));
      populateFilters();
      displayProducts(allProducts);
    }

    function populateFilters() {
      const cat = document.getElementById("filterCategory");
      const sub = document.getElementById("filterSubcategory");
      cat.querySelectorAll("option:not([value=''])").forEach(o => o.remove());
      sub.querySelectorAll("option:not([value=''])").forEach(o => o.remove());
      Object.keys(subcategories).forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c; cat.appendChild(opt);
      });
      Object.values(subcategories).flat().forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s; sub.appendChild(opt);
      });
    }

    function displayProducts(products) {
      const list = document.getElementById("productList");
      list.innerHTML = "";

      products.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const images = item.images?.length > 0 ? item.images : (item.image ? [item.image] : []);
        const imgsHtml = images.length > 0
          ? images.map((url, i) => `<img src="${safeUrl(url) || 'data:,'}" class="${i === 0 ? 'active' : ''}">` ).join('')
          : '<img src="" alt="No Image" class="active">';
        const navHtml = images.length > 1
          ? `<div class="card-nav"><button class="prev-img">◀</button><button class="next-img">▶</button></div>
             <p class="img-counter">1 / ${images.length}</p>`
          : '';

        card.innerHTML = `
          <div class="card-images">
            ${imgsHtml}
            ${navHtml}
          </div>
          <div class="card-content">
            <div class="card-tags">
              <span>${escapeHtml(item.category)}</span>
              <span>${escapeHtml(item.subcategory)}</span>
            </div>
            <h3>${escapeHtml(item.name)}</h3>
            <p class="card-desc">${escapeHtml(item.description || "No description provided.")}</p>
            <div class="card-footer">
              <span class="card-price">฿${Number(item.price || 0).toLocaleString()}</span>
              ${safeUrl(item.pdf) ? `<a href="${safeUrl(item.pdf)}" target="_blank" rel="noopener noreferrer" class="card-pdf">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Spec Sheet
              </a>` : ""}
            </div>
            <div class="card-actions">
              <button class="btn btn-outline btn-sm edit-btn">Edit</button>
              <button class="btn btn-danger btn-sm delete">Delete</button>
            </div>
          </div>
        `;

        // Carousel
        if (images.length > 1) {
          let idx = 0;
          const imgEls  = card.querySelectorAll(".card-images img");
          const counter = card.querySelector(".img-counter");
          card.querySelector(".prev-img").onclick = () => {
            imgEls[idx].classList.remove("active");
            idx = (idx - 1 + images.length) % images.length;
            imgEls[idx].classList.add("active");
            counter.textContent = `${idx + 1} / ${images.length}`;
          };
          card.querySelector(".next-img").onclick = () => {
            imgEls[idx].classList.remove("active");
            idx = (idx + 1) % images.length;
            imgEls[idx].classList.add("active");
            counter.textContent = `${idx + 1} / ${images.length}`;
          };
        }

        card.querySelector(".delete").onclick = async () => {
          if (!confirm("Delete this product?")) return;
          await deleteDoc(doc(db, "products", item.id));
          loadProducts();
        };

        card.querySelector(".edit-btn").onclick = () => openEditModal(item);

        list.appendChild(card);
      });
    }

    document.getElementById("filterCategory").addEventListener("change", applyFilter);
    document.getElementById("filterSubcategory").addEventListener("change", applyFilter);

    function applyFilter() {
      let f = allProducts;
      const cat = document.getElementById("filterCategory").value;
      const sub = document.getElementById("filterSubcategory").value;
      if (cat) f = f.filter(p => p.category === cat);
      if (sub) f = f.filter(p => p.subcategory === sub);
      displayProducts(f);
    }

    function clearAddForm() {
      ["name","price","description"].forEach(id => document.getElementById(id).value = "");
      categorySelect.value = "";
      subcategorySelect.innerHTML = "<option value=''>Select Subcategory</option>";
      document.getElementById("pdfFile").value = "";
      selectedFiles = [];
      previewContainer.innerHTML = "";
    }

    document.getElementById("clearBtn").addEventListener("click", clearAddForm);

    // ── Add Product ──
    document.getElementById("addBtn").addEventListener("click", async () => {
      const name        = document.getElementById("name").value.trim();
      const price       = document.getElementById("price").value;
      const description = document.getElementById("description").value.trim();
      const category    = categorySelect.value;
      const subcategory = subcategorySelect.value;
      const pdfFile     = document.getElementById("pdfFile").files[0];

      if (!name || !price || !category || !subcategory || selectedFiles.length === 0) {
        alert("Please fill all required fields and select at least one image.");
        return;
      }

      const btn = document.getElementById("addBtn");
      btn.textContent = "Uploading..."; btn.disabled = true;

      try {
        const imageUrls = [];
        for (const file of selectedFiles) {
          const r   = ref(storage, "products/" + Date.now() + "_" + file.name);
          await uploadBytes(r, file);
          imageUrls.push(await getDownloadURL(r));
        }

        let pdfUrl = "";
        if (pdfFile) {
          const r = ref(storage, "pdfs/" + Date.now() + "_" + pdfFile.name);
          await uploadBytes(r, pdfFile);
          pdfUrl = await getDownloadURL(r);
        }

        await addDoc(collection(db, "products"), {
          name, price: Number(price), description, category, subcategory,
          images: imageUrls, image: imageUrls[0], pdf: pdfUrl
        });

        // Reset
        clearAddForm();

        alert("Product added successfully!");
        loadProducts();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.textContent = "Add Product"; btn.disabled = false;
      }
    });

    // ── Edit Modal ──
    const editModal      = document.getElementById("editModal");
    const closeModalBtn  = document.getElementById("closeModal");
    const editCatSelect  = document.getElementById("edit-category");
    const editSubSelect  = document.getElementById("edit-subcategory");
    const editImgInput   = document.getElementById("edit-imageFile");
    const editImgPreview = document.getElementById("edit-image-preview");

    let editProductId   = null;
    let existingImages  = []; // URLs still kept
    let newEditFiles    = []; // new File objects to upload

    editCatSelect.addEventListener("change", () =>
      fillSubcategories(editSubSelect, editCatSelect.value));

    editImgInput.addEventListener("change", () => {
      Array.from(editImgInput.files).forEach(f => {
        if (!newEditFiles.find(x => x.name === f.name)) newEditFiles.push(f);
      });
      editImgInput.value = "";
      renderPreviews(editImgPreview, newEditFiles, () => {});
    });

    function openEditModal(item) {
      editProductId  = item.id;
      existingImages = item.images?.length > 0 ? [...item.images] : (item.image ? [item.image] : []);
      newEditFiles   = [];
      editImgPreview.innerHTML = "";

      document.getElementById("edit-name").value        = item.name || "";
      document.getElementById("edit-price").value       = item.price || "";
      document.getElementById("edit-description").value = item.description || "";
      document.getElementById("edit-pdfFile").value     = "";

      editCatSelect.value = item.category || "";
      fillSubcategories(editSubSelect, item.category, item.subcategory);

      // Render existing images with remove buttons
      const existingContainer = document.getElementById("edit-existing-images");
      renderExistingImages(existingContainer);

      editModal.classList.add("open");
    }

    function renderExistingImages(container) {
      container.innerHTML = "";
      if (existingImages.length === 0) {
        container.innerHTML = `<p style="grid-column:1/-1;color:var(--text-muted);font-size:0.85rem;">No images left. Add new images before saving if needed.</p>`;
        return;
      }
      existingImages.forEach((url, i) => {
        const item = document.createElement("div");
        item.className = "existing-img-item";
        const img = document.createElement("img");
        img.src = safeUrl(url) || "data:,";
        img.alt = "Existing product image";
        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-existing";
        removeBtn.textContent = "×";
        item.appendChild(img);
        item.appendChild(removeBtn);
        removeBtn.addEventListener("click", () => {
          existingImages.splice(i, 1);
          renderExistingImages(container);
        });
        container.appendChild(item);
      });
    }

    closeModalBtn.addEventListener("click", () => editModal.classList.remove("open"));
    editModal.addEventListener("click", e => { if (e.target === editModal) editModal.classList.remove("open"); });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name        = document.getElementById("edit-name").value.trim();
      const price       = document.getElementById("edit-price").value;
      const description = document.getElementById("edit-description").value.trim();
      const category    = editCatSelect.value;
      const subcategory = editSubSelect.value;
      const pdfFile     = document.getElementById("edit-pdfFile").files[0];

      if (!name || !price || !category || !subcategory) {
        alert("Please fill in all required fields.");
        return;
      }

      const btn = document.getElementById("saveBtn");
      btn.textContent = "Saving..."; btn.disabled = true;

      try {
        // Upload any new images
        const newUrls = [];
        for (const file of newEditFiles) {
          const r = ref(storage, "products/" + Date.now() + "_" + file.name);
          await uploadBytes(r, file);
          newUrls.push(await getDownloadURL(r));
        }

        const finalImages = [...existingImages, ...newUrls];

        // Upload new PDF if provided
        let pdfUrl = "";
        if (pdfFile) {
          const r = ref(storage, "pdfs/" + Date.now() + "_" + pdfFile.name);
          await uploadBytes(r, pdfFile);
          pdfUrl = await getDownloadURL(r);
        }

        const updateData = {
          name, price: Number(price), description, category, subcategory,
          images: finalImages,
          image: finalImages[0] || ""
        };

        // Only overwrite PDF if a new one was uploaded
        if (pdfUrl) updateData.pdf = pdfUrl;

        await updateDoc(doc(db, "products", editProductId), updateData);

        editModal.classList.remove("open");
        alert("Product updated successfully!");
        loadProducts();
      } catch (err) {
        alert("Error saving: " + err.message);
      } finally {
        btn.textContent = "Save Changes"; btn.disabled = false;
      }
    });

    loadProducts();
  </script>

</body>
</html>
