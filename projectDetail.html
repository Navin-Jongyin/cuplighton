<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Cup Lighton</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html">
            <img src="images/logo/cupLight.png" alt="Cup Lighton Logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#projects">Projects</a>
            <a href="productsPage.html">Products</a>
            <a href="contactUs.html">Contact</a>
        </nav>
    </header>

    <!-- Project Detail Container -->
    <div class="product-detail-container">
        <div class="product-detail-content">

            <!-- Back Button -->
            <a href="index.html#projects" class="back-button">← Back to Projects</a>

            <div class="product-detail-layout">

                <!-- Project Image Gallery -->
                <div class="product-detail-image-section">
                    <div class="product-main-image">
                        <img id="project-image" src="" alt="Project">
                    </div>
                    <div class="product-thumbnail-gallery" id="thumbnail-gallery">
                        <!-- Thumbnails will be added dynamically -->
                    </div>
                </div>

                <!-- Project Info -->
                <div class="product-detail-info">
                    <h1 id="project-name">Loading...</h1>
                    <div class="product-detail-category" id="project-category"></div>

                    <div class="product-detail-description">
                        <h3>Description</h3>
                        <p id="project-description">Professional lighting installation project.</p>
                    </div>

                    <div class="product-detail-features">
                        <h3>Project Details</h3>
                        <ul id="project-details">
                            <li>High-quality lighting installation</li>
                        </ul>
                    </div>

                    <div class="product-actions">
                        <button class="product-detail-btn" onclick="window.location.href='contactUs.html'">Contact
                            Us</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer>
        © 2025 Cup Lighton — All Rights Reserved
    </footer>

    <script>
        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        // Project data
        const projects = {
            'project1': {
                name: 'Lighting Installation Project',
                description: 'Professional outdoor lighting solution designed to enhance the ambiance and safety of outdoor spaces.',
                category: 'Outdoor Installation',
                details: [
                    'Complete outdoor lighting system',
                    'Energy-efficient LED technology',
                    'Professional installation and setup',
                    'Custom lighting design',
                    'Weather-resistant fixtures'
                ],
                images: [
                    'images/projects/project1/project1-1.JPG',
                    'images/projects/project1/project1-2.JPG',
                    'images/projects/project1/project1-3.JPG',
                    'images/projects/project1/project1-4.JPG',
                    'images/projects/project1/project1-5.JPG',
                    'images/projects/project1/project1-6.JPG'
                ]
            }
        };

        // Load project data
        function loadProjectDetail() {
            const project = projects[projectId];

            if (project) {
                // Update page title
                document.title = `${project.name} | Cup Lighton`;

                // Populate project details
                document.getElementById('project-name').textContent = project.name;

                // Add category tag
                const categoryContainer = document.getElementById('project-category');
                categoryContainer.innerHTML = '';
                const tag = document.createElement('span');
                tag.className = 'category-tag';
                tag.textContent = project.category;
                categoryContainer.appendChild(tag);

                // Handle images
                const images = project.images;
                const mainImage = document.getElementById('project-image');
                const thumbnailGallery = document.getElementById('thumbnail-gallery');

                // Set main image
                mainImage.src = images[0];
                mainImage.alt = project.name;

                // Create thumbnails
                thumbnailGallery.innerHTML = '';
                images.forEach((img, index) => {
                    const thumbnail = document.createElement('img');
                    thumbnail.src = img;
                    thumbnail.alt = `${project.name} - Image ${index + 1}`;
                    thumbnail.className = index === 0 ? 'thumbnail active-thumbnail' : 'thumbnail';
                    thumbnail.onclick = () => {
                        mainImage.src = img;
                        // Update active thumbnail
                        document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active-thumbnail'));
                        thumbnail.classList.add('active-thumbnail');
                    };
                    thumbnailGallery.appendChild(thumbnail);
                });

                // Add description
                document.getElementById('project-description').textContent = project.description;

                // Add details
                const detailsList = document.getElementById('project-details');
                detailsList.innerHTML = '';
                project.details.forEach(detail => {
                    const li = document.createElement('li');
                    li.textContent = detail;
                    detailsList.appendChild(li);
                });
            } else {
                // Project not found
                document.querySelector('.product-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2>Project Not Found</h2>
                        <p>The project you're looking for doesn't exist.</p>
                        <a href="index.html#projects" class="back-button">← Back to Projects</a>
                    </div>
                `;
            }
        }

        // Load project on page load
        document.addEventListener('DOMContentLoaded', loadProjectDetail);
    </script>

</body>

</html>
