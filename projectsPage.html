<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cup Lighton | Projects</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html">
            <img src="images/logo/logo_2.png" class="logo" alt="Cup Lighton Logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="projectsPage.html">Projects</a>
            <a href="productsPage.html">Products</a>
            <a href="contactUs.html">Contact</a>
        </nav>
    </header>

    <!-- Page Layout -->
    <div class="products-page-wrapper">

        <!-- LEFT SIDEBAR (Categories) -->
        <aside class="products-sidebar">
            <h3>Categories</h3>
            <div id="category-list">
                <div class="products-category-item products-category-active" data-category="all">All Projects</div>
                <div class="products-category-item" data-category="outdoor">Outdoor</div>
                <div class="products-category-item" data-category="indoor">Indoor</div>
                <div class="products-category-item" data-category="commercial">Commercial</div>
                <div class="products-category-item" data-category="residential">Residential</div>
            </div>
        </aside>

        <!-- RIGHT CONTENT -->
        <section class="products-content-area">

            <!-- Search Box -->
            <div class="products-search-container">
                <input type="text" id="search-input" class="products-search-input" placeholder="Search projects...">
                <span class="products-search-icon">🔍</span>
            </div>

            <div id="status" class="products-status">Loading projects...</div>

            <div id="project-grid" class="products-grid">
                <!-- Projects will be loaded dynamically -->
            </div>

        </section>

    </div>

    <!-- Footer -->
    <footer>
        © 2025 Cup Lighton — All Rights Reserved
    </footer>

    <!-- SCRIPT -->
    <script>
        const statusEl = document.getElementById("status");
        const categoryItems = document.querySelectorAll(".products-category-item");
        const projectGrid = document.getElementById("project-grid");
        const searchInput = document.getElementById("search-input");
        let allProjects = [];
        let currentCategory = "all";

        // Project data
        const projects = [
            {
                id: 'project1',
                name: 'Lighting Installation Project',
                description: 'Professional outdoor lighting solution',
                categories: ['outdoor', 'commercial'],
                image: 'images/projects/project1/project1-1.JPG'
            }
        ];

        // Load projects
        function loadProjects() {
            allProjects = projects;
            renderProjects(allProjects);
            statusEl.textContent = `Showing all ${allProjects.length} project(s).`;
        }

        // Filter projects based on category and search term
        function filterProjects() {
            const searchTerm = searchInput.value.toLowerCase();
            let filteredProjects = allProjects;

            // Filter by category
            if (currentCategory !== "all") {
                filteredProjects = filteredProjects.filter(p => {
                    if (Array.isArray(p.categories)) {
                        return p.categories.includes(currentCategory);
                    }
                    return false;
                });
            }

            // Filter by search term
            if (searchTerm) {
                filteredProjects = filteredProjects.filter(p => {
                    const nameMatch = p.name.toLowerCase().includes(searchTerm);
                    let categoryMatch = false;

                    if (Array.isArray(p.categories)) {
                        categoryMatch = p.categories.some(cat => cat.toLowerCase().includes(searchTerm));
                    }

                    return nameMatch || categoryMatch;
                });
            }

            // Render filtered projects
            renderProjects(filteredProjects);

            // Update status
            if (searchTerm) {
                statusEl.textContent = `Found ${filteredProjects.length} project(s) matching "${searchTerm}".`;
            } else if (currentCategory === "all") {
                statusEl.textContent = `Showing all ${allProjects.length} project(s).`;
            } else {
                statusEl.textContent = `Showing ${filteredProjects.length} project(s) in "${capitalize(currentCategory)}".`;
            }
        }

        // Search input event
        searchInput.addEventListener("input", filterProjects);

        // Render projects to the grid
        function renderProjects(projects) {
            projectGrid.innerHTML = '';

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'products-card';

                // Set data-category attribute (use first category if multiple)
                const categoryData = Array.isArray(project.categories)
                    ? project.categories[0]
                    : project.category;
                card.setAttribute('data-category', categoryData);
                card.style.cursor = 'pointer';

                // Add click event to navigate to project detail page
                card.addEventListener('click', () => {
                    window.location.href = `projectDetail.html?id=${project.id}`;
                });

                // Display categories (show all if multiple)
                let categoryDisplay;
                if (Array.isArray(project.categories)) {
                    categoryDisplay = project.categories.map(cat => capitalize(cat)).join(', ');
                } else {
                    categoryDisplay = capitalize(project.category);
                }

                card.innerHTML = `
                    <img src="${project.image}" alt="${project.name}">
                    <h3 class="products-card-title">${project.name}</h3>
                    <div class="products-card-category">${categoryDisplay}</div>
                    <p style="padding: 0 15px 15px; color: #666; font-size: 14px; margin: 0;">${project.description}</p>
                `;

                projectGrid.appendChild(card);
            });
        }

        // Category filtering
        categoryItems.forEach(item => {
            item.addEventListener("click", () => {
                const category = item.dataset.category;
                currentCategory = category;

                // active state on sidebar
                categoryItems.forEach(c => c.classList.remove("products-category-active"));
                item.classList.add("products-category-active");

                // Filter projects with current search term
                filterProjects();
            });
        });

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Load projects on page load
        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>

</body>

</html>
