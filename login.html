<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Cuplighton</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
      padding: 2rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo img {
      height: 48px;
      margin: 0 auto;
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.9rem;
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
      color: #1a1a1a;
      background: #fafafa;
    }

    .form-group input:focus {
      outline: none;
      border-color: #FFC107;
      box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
      background: #fff;
    }

    #login-btn {
      width: 100%;
      padding: 0.9rem;
      background: #FFC107;
      color: #1a1a1a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s ease, transform 0.15s ease;
      letter-spacing: 0.05em;
    }

    #login-btn:hover { background: #FFB300; transform: translateY(-2px); }
    #login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    #error-msg {
      color: #d32f2f;
      font-size: 0.88rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
      text-decoration: none;
    }

    .back-link:hover { color: #FFC107; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="images/Logo/logo.png" alt="Cuplighton Logo">
      </div>
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Sign in to manage your products</p>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button id="login-btn">Sign In</button>
      <p id="error-msg"></p>

      <a href="index.html" class="back-link">← Back to website</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8JyqoRLjwn93CsL9iOkZ8w79VT2OU5VI",
      authDomain: "cuplighton-72192.firebaseapp.com",
      projectId: "cuplighton-72192",
      storageBucket: "cuplighton-72192.firebasestorage.app",
      messagingSenderId: "60391723671",
      appId: "1:60391723671:web:fc2b7b509b99b595f74fd2"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // If already logged in, go straight to admin panel
    if (sessionStorage.getItem('isAdmin') === 'true') {
      window.location.href = 'showprod.html';
    }

    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    // Allow pressing Enter to submit
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') loginBtn.click();
    });

    loginBtn.addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter your username and password.');
        return;
      }

      loginBtn.textContent = 'Signing in…';
      loginBtn.disabled    = true;
      errorMsg.style.display = 'none';

      try {
        // Fetch admin credentials from Firestore
        const snap = await getDoc(doc(db, 'adminID', 'Admin'));

        if (!snap.exists()) {
          showError('Admin record not found. Please contact the system administrator.');
          return;
        }

        const data = snap.data();

        if (username === data.username && password === data.password) {
          // Credentials match — store session and redirect
          sessionStorage.setItem('isAdmin', 'true');
          window.location.href = 'showprod.html';
        } else {
          showError('Incorrect username or password. Please try again.');
        }
      } catch (err) {
        showError('Login failed. Please check your connection and try again.');
        console.error(err);
      } finally {
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled    = false;
      }
    });

    function showError(msg) {
      errorMsg.textContent   = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
