<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS Admin — Cuplighton</title>
  <style>
    body{font-family:system-ui,Arial;margin:0;padding:1rem}
    .wrap{max-width:1000px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center}
    #pages{margin-top:1rem}
    .page-item{padding:.5rem;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
    textarea{width:100%;height:300px}
    .hidden{display:none}
    .controls{display:flex;gap:.5rem}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Cuplighton — Admin</h1>
      <div id="authUI">
        <button id="signInBtn">Sign In</button>
        <button id="signOutBtn" class="hidden">Sign Out</button>
      </div>
    </header>

    <section id="login" class="hidden">
      <h2>Sign in (email/password)</h2>
      <input id="email" placeholder="email" />
      <input id="password" placeholder="password" type="password" />
      <button id="doSignIn">Sign In</button>
    </section>

    <section id="adminUI" class="hidden">
      <div style="display:flex;gap:1rem;align-items:center;margin-top:1rem">
        <div style="flex:1">
          <h2>Pages</h2>
          <div id="pages">Loading…</div>
          <button id="newPage">New Page</button>
        </div>

        <div style="flex:2">
          <h2>Edit</h2>
          <div>
            <label>Slug (id)</label>
            <input id="slug" />
          </div>
          <div>
            <label>Title</label>
            <input id="title" />
          </div>
          <div>
            <label>HTML content</label>
            <textarea id="contentHtml"></textarea>
          </div>
          <div class="controls">
            <button id="saveDraft">Save draft</button>
            <button id="publish">Publish</button>
            <button id="deletePage">Delete</button>
            <button id="preview">Preview</button>
          </div>
          <div id="previewArea" class="hidden" style="border:1px solid #ddd;margin-top:1rem;padding:1rem"></div>
        </div>
      </div>

    </section>

  </div>

  <script type="module" src="/cms-admin/src/js/admin.js"></script>
</body>
</html>
