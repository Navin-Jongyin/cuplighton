<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Cuplighton</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <!-- Navigation -->
    <header class="header">
        <div class="container nav flex">
            <a href="index.html" class="logo">
                <img src="images/Logo/logo.png" alt="Logo">
            </a>
            <nav>
                <ul class="flex nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="products.html" class="nav-link active">Products</a></li>
                    <li><a href="services.html" class="nav-link"> Services</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="padding-top: var(--header-height);">
        <section class="product-detail-section" style="padding: 4rem 0;">
            <div class="container">
                <!-- Breadcrumbs -->
                <div class="breadcrumbs" style="margin-bottom: 2rem; color: var(--text-secondary);">
                    <a href="index.html">Home</a> / <a href="products.html">Products</a> / <span id="detail-category"
                        class="text-gold">Category</span> / <span id="detail-name">Product Name</span>
                </div>

                <div class="product-detail-container">
                    <!-- Left Column: Image -->
                    <div class="product-detail-image">
                        <img id="detail-image" src="" alt="Product Image">
                    </div>

                    <!-- Right Column: Info -->
                    <div class="product-detail-info">
                        <h1 id="detail-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Product Title</h1>
                        <p id="detail-price" class="text-gold" style="font-size: 1.5rem; margin-bottom: 1.5rem;">$0.00
                        </p>

                        <div class="description-block" style="margin-bottom: 2rem;">
                            <h3 style="margin-bottom: 0.5rem;">Description</h3>
                            <p id="detail-description" style="line-height: 1.6; color: var(--text-secondary);">Product
                                description goes here.</p>
                        </div>

                        <div class="features-block" style="margin-bottom: 2rem;">
                            <h3 style="margin-bottom: 0.5rem;">Features</h3>
                            <ul id="detail-features"
                                style="list-style: disc; padding-left: 1.5rem; color: var(--text-secondary);">
                                <!-- Features populated by JS -->
                            </ul>
                        </div>

                        <button class="btn btn-primary" style="width: 100%; max-width: 300px;">Add to Cart</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2025 Cuplighton. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
